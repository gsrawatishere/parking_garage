services:
  postgres:
    image: postgres:16-alpine
    container_name: parking-garage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parking_garage
    ports:
      - "5432:5432"
    volumes:
      - parking_garage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking_garage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parking_garage_postgres_data:
